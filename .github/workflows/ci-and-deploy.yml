name: Prepare inline supply screenshot review
on:
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        required: true
      target_branch:
        type: string
        required: true
      linux_run:
        type: string
        default: ''
      linux_extra:
        type: string
        default: ''
      mac_extra:
        type: string
        default: ''
      linux_overlay:
        type: string
        default: ''
      mac_fallback:
        type: string
        default: ''
      mac_run:
        type: string
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install image tooling separately from the project
        run: mkdir -p /tmp/baseline-tools && cd /tmp/baseline-tools && bun add sharp@0.34.5
      - name: Wait for successful source runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_RUN: ${{ inputs.linux_run }}
          MAC_RUN: ${{ inputs.mac_run }}
          LINUX_OVERLAY: ${{ inputs.linux_overlay }}
          MAC_FALLBACK: ${{ inputs.mac_fallback }}
          LINUX_EXTRA: ${{ inputs.linux_extra }}
          MAC_EXTRA: ${{ inputs.mac_extra }}
        run: |
          for run in "$LINUX_RUN" "$LINUX_OVERLAY" "$MAC_RUN" "$LINUX_EXTRA" "$MAC_EXTRA"; do
            if [[ -z "$run" ]]; then continue; fi
            if ! gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30; then
              if [[ "$run" == "$LINUX_RUN" && -n "$LINUX_OVERLAY" ]]; then
                echo 'The diagnosed full-run failure must pass in the supplied focused overlay.'
              elif [[ "$run" == "$MAC_RUN" && -n "$MAC_FALLBACK" ]]; then
                echo 'Mac draft/deal capture-budget failures remain recorded; use matching images from the previously passing focused stories for visual review.'
              else
                exit 1
              fi
            fi
          done
      - uses: actions/download-artifact@v4
        if: inputs.linux_run != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_run }}
          name: linux-screenshot-baselines
          path: /tmp/baseline-input/linux
      - uses: actions/download-artifact@v4
        if: inputs.linux_overlay != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_overlay }}
          name: linux-screenshot-baselines
          path: /tmp/baseline-input/linux
      - uses: actions/download-artifact@v4
        if: inputs.linux_extra != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_extra }}
          name: linux-screenshot-baselines
          path: /tmp/baseline-input/linux
      - uses: actions/download-artifact@v4
        if: inputs.mac_run != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.mac_run }}
          name: darwin-screenshot-baselines
          path: /tmp/baseline-input/darwin
      - uses: actions/download-artifact@v4
        if: inputs.mac_fallback != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.mac_fallback }}
          name: darwin-screenshot-baselines
          path: /tmp/baseline-mac-fallback
      - name: Complete Mac draft images from matching focused evidence
        if: inputs.mac_fallback != ''
        run: |
          node --input-type=module <<'JS'
          import sharp from '/tmp/baseline-tools/node_modules/sharp/lib/index.js';
          import {readdir,readFile,writeFile,mkdir} from 'node:fs/promises';
          import {dirname} from 'node:path';
          const root='/tmp/baseline-mac-fallback';
          const names=(await readdir(root,{recursive:true})).filter(n=>n.endsWith('-darwin.png')&&(n.startsWith('003-bloodline/screenshots/4-players-draft-')||n.startsWith('003-bloodline/screenshots/a-lost-begin-')));
          let matched=0,filled=0;
          for(const name of names){
            const source=await readFile(`${root}/${name}`),target=`/tmp/baseline-input/darwin/${name}`;
            const existing=await readFile(target).catch(()=>null);
            if(existing){
              if(!(await sharp(source).ensureAlpha().raw().toBuffer()).equals(await sharp(existing).ensureAlpha().raw().toBuffer()))throw Error(`Focused Mac evidence differs: ${name}`);
              matched++;
            }else{await mkdir(dirname(target),{recursive:true});await writeFile(target,source);filled++;}
          }
          console.log({matched,filled});
          if(!matched)throw Error('No matching Mac draft evidence');
          JS
      - uses: actions/download-artifact@v4
        if: inputs.mac_extra != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.mac_extra }}
          name: darwin-screenshot-baselines
          path: /tmp/baseline-input/darwin
      - name: Preserve exact pixels and prepare review images
        run: |
          node --input-type=module <<'JS'
          import sharp from '/tmp/baseline-tools/node_modules/sharp/lib/index.js';
          import {readdir,readFile,writeFile,mkdir,unlink} from 'node:fs/promises';
          import {dirname} from 'node:path';
          const changed=[],differences=[],linuxChanges=new Set();
          for(const platform of ['linux','darwin']){
            const root=`/tmp/baseline-input/${platform}`;
            const names=(await readdir(root,{recursive:true}).catch(()=>[])).filter(n=>n.endsWith(`-${platform}.png`)&&!/009-direct-play\/screenshots\/an-expanded-fan.*\/(002-last-copy|003-play-all)-/.test(n)).sort();
            let next=0;
            await Promise.all(Array.from({length:3},async()=>{
              while(next<names.length){
                const name=names[next++];if(name.startsWith('/')||name.split('/').includes('..'))throw Error('Unsafe image path');
                const target=`tests/e2e/${name}`;
                // Keep pre-existing Mac raster differences out of this UI change.
                if(platform==='darwin'&&!linuxChanges.has(target.replace(/-darwin\.png$/,'-linux.png'))){await unlink(`${root}/${name}`);continue;}
                const source=await readFile(`${root}/${name}`);
                const pixels=await sharp(source).ensureAlpha().raw().toBuffer();
                const existing=await readFile(target).catch(()=>null);
                if(existing&&pixels.equals(await sharp(existing).ensureAlpha().raw().toBuffer())){await unlink(`${root}/${name}`);continue;}
                if(existing){
                  const old=await sharp(existing).ensureAlpha().raw().toBuffer(),{width,height}=await sharp(source).metadata();
                  let count=0,maxDelta=0,minX=width,minY=height,maxX=0,maxY=0;
                  for(let i=0;i<pixels.length;i+=4){let differs=false;for(let c=0;c<4;c++){const delta=Math.abs(pixels[i+c]-old[i+c]);if(delta){differs=true;maxDelta=Math.max(maxDelta,delta);}}if(differs){count++;const x=(i/4)%width,y=Math.floor(i/4/width);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}}
                  differences.push({path:target,count,maxDelta,bounds:[minX,minY,maxX,maxY]});
                }else differences.push({path:target,new:true});
                const compressed=await sharp(source).png({compressionLevel:6,adaptiveFiltering:true}).toBuffer();
                if(!pixels.equals(await sharp(compressed).ensureAlpha().raw().toBuffer()))throw Error(`Pixels changed: ${name}`);
                await mkdir(dirname(target),{recursive:true});await writeFile(target,compressed);await unlink(`${root}/${name}`);
                changed.push(target);if(platform==='linux')linuxChanges.add(target);
              }
            }));
          }
          changed.sort();await mkdir('/tmp/baseline-review',{recursive:true});await writeFile('/tmp/baseline-review/differences.json',JSON.stringify(differences,null,2));await writeFile('/tmp/baseline-review/changed.json',JSON.stringify(changed,null,2));
          for(const platform of ['linux','darwin'])for(const project of ['phone','desktop','tabletop-4k']){
            const paths=changed.filter(p=>p.endsWith(`-${project}-${platform}.png`));
            const output=`/tmp/baseline-review/${platform}/${project}`;await mkdir(output,{recursive:true});await writeFile(`${output}/index.json`,JSON.stringify(paths,null,2));
            const width=project==='phone'?164:320,height=project==='phone'?356:project==='desktop'?223:180,columns=project==='phone'?6:4;
            for(let batch=0;batch<Math.ceil(paths.length/24);batch++){
              const tiles=[];
              for(let i=0;i<24&&batch*24+i<paths.length;i++){
                const idx=batch*24+i,path=paths[idx],left=i%columns*width,top=Math.floor(i/columns)*(height+22);
                tiles.push({input:await sharp(path).resize(width,height,{fit:'contain',background:'#111'}).png().toBuffer(),left,top});
                tiles.push({input:Buffer.from(`<svg width="${width}" height="22"><text x="5" y="16" fill="white" font-size="12">${idx}: ${path.split('/').at(-1).split('-').slice(0,3).join('-')}</text></svg>`),left,top:top+height});
              }
              await sharp({create:{width:columns*width,height:Math.ceil(24/columns)*(height+22),channels:3,background:'#111'}}).composite(tiles).png().toFile(`${output}/${batch}.png`);
            }
            console.log(platform,project,paths.length);
          }
          for(const path of changed.filter(p=>/000-supply|small-landscape|landscape-table|fallback-pages|expanded-fan|play-all/.test(p))){const target=`/tmp/baseline-review/full/${path}`;await mkdir(dirname(target),{recursive:true});await writeFile(target,await readFile(path));}
          console.log(`${changed.length} changed images prepared for review`);
          JS
      - name: Save baselines on the isolated review branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          case "$TARGET_BRANCH" in validate/inline-supply-reviewed*) ;; *) echo 'Unexpected target branch'; exit 1;; esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config pack.window 0
          git config pack.compression 1
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          names=json.loads(Path('/tmp/baseline-review/changed.json').read_text())
          batch=[];size=0;number=0
          def save():
              global batch,size,number
              if not batch:return
              number+=1
              subprocess.run(['git','add','--',*batch],check=True)
              subprocess.run(['git','commit','-m',f'Prepare inline supply screenshot review batch {number}'],check=True)
              subprocess.run(['git','push','origin',f"HEAD:refs/heads/{os.environ['TARGET_BRANCH']}"],check=True)
              batch=[];size=0
          for name in names:
              length=Path(name).stat().st_size
              if size+length>300*1024*1024:save()
              batch.append(name);size+=length
          save()
          PYTHON
          git rev-parse HEAD > /tmp/baseline-review/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-supply-visual-review
          path: /tmp/baseline-review/
          compression-level: 0

name: Inspect inline supply comparison differences
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '36776621115'
          name: card-gallery-browser-report
          path: /tmp/report
      - name: Select representative failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, json
          root=Path('/tmp/report/test-results'); dest=Path('/tmp/review'); dest.mkdir()
          names=[str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()]
          (dest/'files.json').write_text(json.dumps(names,indent=2))
          dirs=[p for p in root.iterdir() if p.is_dir()]
          selected=[]
          for project in ['phone','desktop','tabletop-4k']:
            choices=[p for p in dirs if p.name.endswith('-'+project)]
            for prefix in ['003-bloodline-bloodline-2-','005-economy-economy-integra','009-direct-play']:
              match=next((p for p in sorted(choices) if p.name.startswith(prefix)),None)
              if match and match not in selected:selected.append(match)
          for p in selected:shutil.copytree(p,dest/p.name)
          print([p.name for p in selected])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: representative-comparison-diffs
          path: /tmp/review
          compression-level: 0

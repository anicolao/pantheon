name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      story_filter:
        description: Optional test-title pattern for focused manual checks (never deploys)
        type: string
        default: ''
      update_snapshots:
        description: Generate Linux screenshot baselines for review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test:policy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bunx playwright install --with-deps chromium
      - run: bun run check && bun run test:backend
      - name: Browser stories and gallery regression checks
        run: |
          if [[ "${{ inputs.update_snapshots }}" == "true" ]]; then
            bun run test:e2e:update
          else
            bun run test:e2e
          fi
        env:
          CI: 'true'
          E2E_STORY_FILTER: ${{ inputs.story_filter || '' }}
          # Invitation screenshots use the same URL in manual and PR verification.
          PUBLIC_BASE_PATH: /pantheon/prtest
      - name: Collect changed Linux baselines
        if: inputs.update_snapshots == true && always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '--others', '--modified', '--exclude-standard', '-z', '--', 'tests/e2e']).split(b'\0')
          for raw in paths:
              if not raw.endswith(b'-linux.png'):
                  continue
              source = Path(raw.decode())
              target = Path('linux-screenshot-baselines') / source.relative_to('tests/e2e')
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: inputs.update_snapshots == true && always()
        with:
          name: linux-screenshot-baselines
          compression-level: 0
          path: linux-screenshot-baselines/
      - name: Upload browser report and card screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-gallery-browser-report
          compression-level: 0
          path: |
            playwright-report/
            test-results/
          retention-days: 14

name: Deploy preview and production

on:
  push:
    branches: [main]
  pull_request:
    # Stacked PRs also need their own playable preview.
  workflow_dispatch:
    inputs:
      preview_pr:
        description: Pull request number to deploy from this branch
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    # Verification is independent; only writes to the shared preview branch serialize.
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Deployment needs application assets, not the multi-GB E2E baselines.
          sparse-checkout: |
            src
            static
            scripts
            balance-checkpoint
            historical-thaleia
            standard-matrix
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Choose deployment path
        id: deployment
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview_pr }}
        run: |
          if [[ "$EVENT_NAME" != "push" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
            echo "base=/pantheon/pr$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "destination=pr$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "base=/pantheon" >> "$GITHUB_OUTPUT"
            echo "destination=" >> "$GITHUB_OUTPUT"
          fi
      - run: bun run build
        env:
          PUBLIC_BASE_PATH: ${{ steps.deployment.outputs.base }}
          VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          VITE_BUILD_SOURCE: ${{ github.sha }}
          VITE_BUILD_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          destination_dir: ${{ steps.deployment.outputs.destination }}
          keep_files: true
      - name: Link retained PR preview
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.preview_pr }}
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/pantheon/pr${{ github.event.pull_request.number || inputs.preview_pr }}/
        run: >-
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          --edit-last --create-if-none
          --body "Pantheon preview: [$PREVIEW_URL]($PREVIEW_URL)"

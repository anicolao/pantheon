name: Package reviewed screenshot artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
      artifact_name:
        type: string
        required: true
      platform:
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun add sharp@0.34.5
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: raw
      - name: Compress without changing decoded pixels
        run: |
          node --input-type=module <<'JS'
          import sharp from 'sharp';
          import {readdir,readFile,writeFile,mkdir,unlink} from 'node:fs/promises';
          import {dirname} from 'node:path';
          const names=(await readdir('raw',{recursive:true})).filter(name=>name.endsWith('.png')).sort();
          let next=0,part=0,bytes=0,completed=0;
          await Promise.all(Array.from({length:4},async()=>{
            while(next<names.length){
              const name=names[next++],source=await readFile(`raw/${name}`);
              const pixels=await sharp(source).ensureAlpha().raw().toBuffer();
              const compressed=await sharp(source).png({compressionLevel:9,adaptiveFiltering:true}).toBuffer();
              if(!pixels.equals(await sharp(compressed).ensureAlpha().raw().toBuffer()))throw Error(`Pixels changed: ${name}`);
              if(bytes+compressed.length>350*1024*1024){part++;bytes=0;}
              if(part>=16)throw Error('Too many artifact parts');
              const target=`parts/part-${part}/${name}`;bytes+=compressed.length;
              await mkdir(dirname(target),{recursive:true});await writeFile(target,compressed);await unlink(`raw/${name}`);
              completed++;if(completed%100===0)console.log(`${completed}/${names.length} images compressed losslessly`);
            }
          }));
          console.log(`${completed} images in ${part+1} parts`);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-0
          compression-level: 0
          path: parts/part-0/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-1
          compression-level: 0
          path: parts/part-1/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-2
          compression-level: 0
          path: parts/part-2/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-3
          compression-level: 0
          path: parts/part-3/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-4
          compression-level: 0
          path: parts/part-4/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-5
          compression-level: 0
          path: parts/part-5/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-6
          compression-level: 0
          path: parts/part-6/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-7
          compression-level: 0
          path: parts/part-7/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-8
          compression-level: 0
          path: parts/part-8/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-9
          compression-level: 0
          path: parts/part-9/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-10
          compression-level: 0
          path: parts/part-10/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-11
          compression-level: 0
          path: parts/part-11/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-12
          compression-level: 0
          path: parts/part-12/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-13
          compression-level: 0
          path: parts/part-13/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-14
          compression-level: 0
          path: parts/part-14/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: compressed-${{ inputs.platform }}-15
          compression-level: 0
          path: parts/part-15/
          if-no-files-found: ignore
